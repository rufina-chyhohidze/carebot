<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
</head>
<body class="bg-black text-white">

<!-- NAVBAR -->
<div th:replace="fragments/fragments :: navbar"></div>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <h2 class="text-center mb-4">Welcome!</h2>
        <form>
            <div class="mb-3">
                <label for="username" class="form-label ">Username</label>
                <input type="text" id="username" class="form-control form-control-sm" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control form-control-sm" placeholder="Enter your password" required>
            </div>

            <div class="d-flex justify-content-center gap-4 my-3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="options" id="option1" autocomplete="off" checked>
                    <label class="form-check-label" for="option1">
                        Warehouse
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="options" id="option2" autocomplete="off">
                    <label class="form-check-label" for="option2">
                        Store
                    </label>
                </div>
            </div>

            <div class="d-grid gap-2">
                <form action="/login" method="post" class="mt-4">
                    <button type="submit" class="btn btn-warning w-100">Log In</button>
                </form>
                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1">
                    <span class="mx-2">OR</span>
                    <hr class="flex-grow-1">
                </div>
                <form action="/signup" method="post" class="mt-4">
                    <button type="submit" class="btn btn-secondary w-100">Sign Up</button>
                </form>
            </div>
        </form>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="fragments/fragments :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
