<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
</head>
<body class="vh-100" style="background-color: #656565;">
<section class="vh-100" style="background-color: #656565;">
    <!-- NAVBAR -->
    <div th:replace="fragments/fragments :: navbar"></div>

    <div class="container py-5">
        <div class="row d-flex justify-content-center align-items-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg" style="border-radius: 1rem; margin: auto;">
                    <div class="row g-0">
                        <div class="col-md-6 d-none d-md-block">
                            <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/img1.webp"
                                 alt="login form" class="img-fluid" style="border-radius: 1rem 0 0 1rem; height: 100%; object-fit: cover;" />
                        </div>
                        <div class="col-md-6 d-flex align-items-center">
                            <div class="card-body p-3 text-black">

                                <form method="post">
                                    <!-- Logo and Welcome -->
                                    <div class="d-flex align-items-center mb-3 pb-1">
                                        <div class="me-2">
                                            <img id="logoPreview" src="/images/log-r.png" alt="Logo" class="img-fluid" style="max-height: 40px;">
                                        </div>
                                        <span class="h3 fw-bold mb-0">Welcome!</span>
                                    </div>

                                    <!-- Sign-in Text -->
                                    <h6 class="fw-normal mb-2" style="letter-spacing: 1px;">Sign into your account</h6>

                                    <!-- Email Input -->
                                    <div class="form-outline mb-3">
                                        <input type="text" id="email" name="email" class="form-control form-control-sm"
                                               placeholder="Enter your username" required />
                                        <label class="form-label" for="email">Email</label>
                                    </div>

                                    <!-- Password Input -->
                                    <div class="form-outline mb-3">
                                        <input type="password" id="password" name="password"  class="form-control form-control-sm"
                                               placeholder="Enter your password" required />
                                        <label class="form-label" for="password">Password</label>
                                    </div>

                                    <!-- Options -->
                                    <div class="d-flex justify-content-center gap-3 mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="options" id="option1" value="warehouse" checked />
                                            <label class="form-check-label" for="option1">Warehouse</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="options" id="option2" value="store" />
                                            <label class="form-check-label" for="option2">Store</label>
                                        </div>
                                    </div>

                                    <!-- Login Button -->
                                    <div class="pt-1 mb-3">
                                        <button class="btn btn-dark btn-sm btn-block" type="submit">Log In</button>
                                    </div>

                                    <!-- Links -->
                                    <a class="small text-muted" href="#!">Forgot password?</a>
                                    <p class="mb-3" style="color: #393f81;">
                                        Don't have an account? <a th:href="@{/signup}" style="color: #393f81;">Sign Up here</a>
                                    </p>
                                    <a href="#!" class="small text-muted">Terms of use.</a>
                                    <a href="#!" class="small text-muted">Privacy policy</a>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/fragments :: footer"></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
