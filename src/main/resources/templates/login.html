<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<!-- NAVBAR -->
<div th:replace="fragments/fragments :: navbar"></div>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%;">
        <h2 class="text-center mb-4">Login</h2>
        <form>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control form-control-lg" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control form-control-lg" placeholder="Enter your password" required>
            </div>

            <div class="d-flex justify-content-center gap-4 my-3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="options" id="option1" autocomplete="off" checked>
                    <label class="form-check-label" for="option1">
                        Warehouse
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="options" id="option2" autocomplete="off">
                    <label class="form-check-label" for="option2">
                        Store
                    </label>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" id="login" class="btn btn-primary">Login</button>
                <button type="button" id="register" class="btn btn-secondary">Register</button>
            </div>
        </form>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="fragments/fragments :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
