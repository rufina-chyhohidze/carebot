<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <title>Warehouse</title>
    <style>
        /* Custom styles to center the button and make it bigger */
        .sticky-bottom {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; /* To ensure it is above other content */
        }

        .btn-custom {
            font-size: 1.9rem; /* Makes the button text bigger */
            padding: 10px 100px; /* Increase padding for a bigger button */
        }
    </style>
</head>
<body class="bg-black text-white">

<div th:replace="fragments/fragments :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-start">
        <!-- Table Section -->
        <div class="flex-grow-1">
            <h1>Requested Items</h1>
            <form th:action="@{/api/deliveries}" method="post">
                <table class="table table-dark table-striped">
                    <thead>
                    <tr>
                        <th>Select</th>
                        <th>Delivery ID</th>
                        <th>Item Name(s)</th>
                        <th>Drop Point</th>
                        <th>Requested By</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="delivery : ${deliveries}">
                        <td>
                            <input type="radio" name="selectedDeliveryId" th:value="${delivery.id}" class="form-check-input" required>
                        </td>
                        <td th:text="${delivery.id}"></td>
                        <td th:text="${delivery.itemNames}"></td>
                        <td th:text="${delivery.dropPoint}"></td>
                        <td th:text="${delivery.employeeDepartment}"></td>
                    </tr>
                    </tbody>
                </table>
            </form>
        </div>
    </div>


    <!-- Centered and sticky button -->
    <span class="sticky-bottom">
<button type="submit" class="btn btn-warning btn-custom">Send Robot</button>
</span>

    <!-- Delivery Status Section -->
    <div class="container my-4" th:if="${deliveryInProgress}">
        <div class="alert" th:classappend="${progress >= 100} ? 'alert-success' : 'alert-warning'" role="alert">
            <h4 class="alert-heading" th:text="${progress >= 100} ? 'Congratulations, Delivery Completed!' : 'Delivery In Progress'"></h4>
            <p>
                <strong>Items:</strong> <span th:text="${currentDelivery.itemNames}"></span><br>
                <strong>Path:</strong> <span th:text="${currentDelivery.dropPoint}"></span><br>
                <strong>Start Time:</strong> <span th:text="${startTime}"></span><br>
                <strong>Estimated Time:</strong> <span th:text="${estimatedTime}"></span> seconds
            </p>
            <div class="progress">
                <div class="progress-bar progress-bar-striped"
                     th:classappend="${progress >= 100} ? 'bg-success' : 'bg-warning'"
                     role="progressbar"
                     th:style="'width: ' + ${progress} + '%;'"
                     th:aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100">
                    <span th:text="${progress} + '%'"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Congratulations Message -->
    <div class="alert alert-success" th:if="${deliveryComplete}">
        <strong>Congratulations!</strong> Your delivery has been completed successfully!
    </div>
</div>


<div th:replace="fragments/fragments :: footer"></div>
</body>
</html>
