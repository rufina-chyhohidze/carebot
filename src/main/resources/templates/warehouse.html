<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <title>Warehouse</title>
</head>
<body class="bg-black text-white">
<div th:replace="fragments/fragments :: navbar"></div>

<div class="container mt-4">
    <h1>Requested Items</h1>
    <table class="table table-striped">
        <thead>
        <tr>
            <th style="width: 25%;">ID</th>
            <th style="width: 25%;">Item Name</th>
            <th style="width: 25%;">Drop Point</th>
            <th style="width: 25%;">Requested By</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="delivery : ${deliveries}">
            <td th:text="${delivery[0]}"></td>
            <td th:text="${delivery[1]}"></td>
            <td th:text="${delivery[2]}"></td>
            <td th:text="${delivery[3]}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Add new Delivery Button -->
    <form action="/addDelivery" method="post" class="mt-4">
        <button type="submit" class="btn btn-warning w-100">Add New Delivery</button>
    </form>
</div>
<div th:replace="fragments/fragments :: footer"></div>
</body>
</html>
