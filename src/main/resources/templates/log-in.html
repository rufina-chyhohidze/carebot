<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../static/css/login.css" th:href="@{/css/login.css}">
</head>
<body>

<div class="overlay"></div>
<div class="container">
  <div class="form-section">
    <h2>Login</h2>
    <form action="/login" method="POST">
      <div class="form-group mb-3">
        <label for="loginEmail" class="form-label" style="color: white;">Email address</label>
        <input type="email" class="form-control" id="loginEmail" name="email" required placeholder="Enter your email">
      </div>
      <div class="form-group mb-3">
        <label for="loginPassword" class="form-label" style="color: white;">Password</label>
        <input type="password" class="form-control" id="loginPassword" name="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="signup-link">
      <p style="color: white;">Are you not registered with us yet? <a th:href="@{/signup}">Click here to sign up!</a></p>
    </div>
  </div>
</div>

</body>
</html>
