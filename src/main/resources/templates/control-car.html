<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link rel="stylesheet" th:href="@{/css/control.css}" href="/static/css/control.css">

</head>
<body class="bg-black text-white">

<!-- NAVBAR -->
<nav th:replace="fragments/fragments :: navbar"></nav>

<h2 class="text-center mb-4">Control Car</h2>

<div class="control-buttons">
    <button id="forwardsButton" class="btn btn-primary">Forwards</button>
    <button id="backwardsButton" class="btn btn-danger">Backwards</button>
    <button id="leftButton" class="btn btn-warning">Turn Left</button>
    <button id="rightButton" class="btn btn-success">Turn Right</button>
</div>

<script th:src="@{/js/control.js}" src="/static/js/control.js"></script>
<br><br>
<!-- FOOTER -->
<footer th:replace="fragments/fragments :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
