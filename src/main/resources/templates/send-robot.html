<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <title>SendRobot</title>

    <script>
        function getsend(action) {
            // Set the URL to send requests to
            var url = 'http://192.168.129.225/' + action;

            // Use the fetch API to send the request
            fetch(url + '?' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text(); // You can change to response.json() if expecting JSON
                })
                .then(data => {
                    console.log(data); // Handle the response data here
                })
                .catch(error => {
                    console.error('There has been a problem with your fetch operation:', error);
                });
        }
    </script>
</head>
<body class="bg-black text-white">
<div th:replace="fragments/fragments :: navbar"></div>

<div class="container mt-4">
    <h1 class="mb-4 text-center">Send Robot</h1>

    <div class="mb-4">
            <h3>Requested Items</h3>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th style="width: 33%;">ID</th>
                    <th style="width: 33%;">Item Name</th>
                    <th style="width: 33%;">Employee</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${requestedItems}">
                    <td th:text="${item.id}"></td> <!-- Item ID -->
                    <td th:text="${item.itemName}"></td> <!-- Item Name -->
                    <td th:text="${item.employeeName}"></td> <!-- Requested By -->
                </tr>
                </tbody>
            </table>
        </div>



    <div class="mb-4">
        <h3>Drop Point Details</h3>
        <table class="table table-striped">
            <thead>
            <tr>
                <th style="width: 33%;">Drop Point ID</th>
                <th style="width: 33%;">Location</th>
                <th style="width: 33%;">Coordinates</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dropPoint : ${dropPoints}">
                <td th:text="${dropPoint.id}"></td> <!-- Drop Point ID -->
                <td th:text="${dropPoint.locationName}"></td> <!-- Drop Point Name -->
                <td th:text="${dropPoint.coordinates}"></td> <!-- Coordinates -->
            </tr>
            </tbody>
        </table>

        <!-- Send Robot Button -->
<!--        <form action="/sendRobot" method="post" class="mt-4">-->
            <button onmousedown="getsend('yes')" onmouseup="getsend('model4')" class="btn btn-warning w-100">Send Robot</button>
<!--        </form>-->
    </div>
</div>
<!--Footer-->
<div th:replace="fragments/fragments :: footer"></div>
</body>
</html>
