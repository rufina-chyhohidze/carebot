<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>SendRobot</title>
</head>
<body>
<div th:replace="fragments/fragments :: navbar"></div>

<div class="container mt-4">
    <h1 class="mb-4">Send Robot</h1>
    <div class="row">

        <div class="col-md-6">
            <h3>Requested Items</h3>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Item Name</th>
                    <th>Employee</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${requestedItems}">
                    <td th:text="${item.id}"></td> <!-- Item ID -->
                    <td th:text="${item.itemName}"></td> <!-- Item Name -->
                    <td th:text="${item.employeeName}"></td> <!-- Requested By -->
                </tr>
                </tbody>
            </table>
        </div>


            <h3>Drop Point Details</h3>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>Drop Point ID</th>
                    <th>Location</th>
                    <th>Coordinates</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="point : ${dropPoints}">
                    <td th:text="${point.id}"></td> <!-- Drop Point ID -->
                    <td th:text="${point.locationName}"></td> <!-- Drop Point Name -->
                    <td th:text="${point.coordinates}"></td> <!-- Coordinates -->
                </tr>
                </tbody>
            </table>

            <!-- Send Robot Button -->
            <form action="/sendRobot" method="post" class="mt-4">
                <button type="submit" class="btn btn-primary w-100">Send Robot</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
