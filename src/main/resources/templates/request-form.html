<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request an Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<!-- NAVBAR -->
<div th:replace="fragments/fragments :: navbar"></div>

<div class="container my-5">
    <h2 class="text-center mb-4">Request an Item</h2>
    <form id="request-form" class="mb-4" style="max-width: 500px; margin: auto;">
        <div class="mb-3">
            <label for="item-select" class="form-label">Select Item</label>
            <select id="item-select" class="form-select form-select-lg" required>
                <option value="" disabled selected>Select an item</option>
                <option value="item1">Item 1</option>
                <option value="item2">Item 2</option>
                <option value="item3">Item 3</option>
                <option value="item4">Item 4</option>
                <option value="item5">Item 5</option>
                <option value="item6">Item 6</option>
                <option value="item7">Item 7</option>
                <option value="item8">Item 8</option>
                <option value="item9">Item 9</option>
                <option value="item10">Item 10</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="drop-point-select" class="form-label">Select Drop Point</label>
            <select id="drop-point-select" class="form-select form-select-lg" required>
                <option value="" disabled selected>Select a drop point</option>
                <option value="point1">Drop Point 1</option>
                <option value="point2">Drop Point 2</option>
                <option value="point3">Drop Point 3</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Request</button>
    </form>

    <hr>

    <div class="status-section">
        <h3 class="mb-3">Request Status</h3>
        <div class="status-list list-group" id="status-list">
            <div class="list-group-item text-center">No requests yet.</div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="fragments/fragments :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const requestForm = document.getElementById('request-form');
    const itemSelect = document.getElementById('item-select');
    const dropPointSelect = document.getElementById('drop-point-select');
    const statusList = document.getElementById('status-list');

    requestForm.addEventListener('submit', function(event) {
        event.preventDefault();
        const selectedItem = itemSelect.value;
        const selectedDropPoint = dropPointSelect.value;

        if (selectedItem && selectedDropPoint) {
            const timestamp = new Date().toLocaleString();
            const statusItem = document.createElement('div');
            statusItem.className = 'list-group-item d-flex justify-content-between align-items-center';

            statusItem.innerHTML = `
                <div>
                    <strong>Requested: </strong>${selectedItem} to ${selectedDropPoint}
                </div>
                <div class="badge bg-warning text-dark">Pending</div>
                <small class="text-muted">${timestamp}</small>
            `;

            statusList.appendChild(statusItem);

            const defaultMessage = document.querySelector('#status-list .list-group-item.text-center');
            if (defaultMessage && defaultMessage.textContent === 'No requests yet.') {
                defaultMessage.remove();
            }
            requestForm.reset();
        } else {
            alert('Please select both an item and a drop point.');
        }
    });
</script>
</body>
</html>
