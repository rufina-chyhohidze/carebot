<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <title>Home</title>
  <script>
    function getsend(action) {
      // Set the URL to send requests to
      var url = 'http://192.168.137.220/' + action;

      // Use the fetch API to send the request
      fetch(url + '?' + new Date().getTime())
              .then(response => {
                if (!response.ok) {
                  throw new Error('Network response was not ok');
                }
                return response.text(); // You can change to response.json() if expecting JSON
              })
              .then(data => {
                console.log(data); // Handle the response data here
              })
              .catch(error => {
                console.error('There has been a problem with your fetch operation:', error);
              });
    }
  </script>

</head>
<body>

<!--NAVBAR FRAGMENT-->
<div th:replace="fragments/fragments :: navbar"></div>

<!--CAROUSEL-->
<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
  <!-- Carousel indicators -->
  <ol class="carousel-indicators">
    <li data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></li>
    <li data-bs-target="#myCarousel" data-bs-slide-to="1"></li>
    <li data-bs-target="#myCarousel" data-bs-slide-to="2"></li>
  </ol>
  <!-- Wrapper for carousel items -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img th:src="@{/images/image4.avif}" class="d-block w-100" alt="Slide 1">
      <div class="carousel-caption d-none d-md-block">
        <h5>First slide label</h5>
        <p>Some placeholder content for the first slide.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img th:src="@{/images/image4.avif}" class="d-block w-100" alt="Slide 2">
      <div class="carousel-caption d-none d-md-block">
        <h5>Second slide label</h5>
        <p>Some placeholder content for the second slide.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img th:src="@{/images/image4.avif}" class="d-block w-100" alt="Slide 3">
      <div class="carousel-caption d-none d-md-block">
        <h5>Third slide label</h5>
        <p>Some placeholder content for the third slide.</p>
      </div>
    </div>
  </div>
  <!-- Carousel controls -->
  <a class="carousel-control-prev" href="#myCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>
  <a class="carousel-control-next" href="#myCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>
</div>

</html>
