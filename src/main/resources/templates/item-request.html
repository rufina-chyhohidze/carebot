<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request an Item</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.2/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/static/css/dashboard.css">
</head>
<body class="bg-black text-white">

<!-- NAVBAR -->
<nav th:replace="fragments/fragments :: navbar"></nav>


<!--ITEM CARDS-->
<div class="container my-5">

    <div class="request-form-container mb-5">
        <h2 class="text-center mb-4" style="color: #ffc107">Request an Item</h2>
        <form method="post" id="request-form" class="mb-4">
            <div class="row justify-content-center mb-4">
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3">
                    <input type="radio" class="btn-check" name="item" id="item-headphones" value="Headphones" required>
                    <label class="card bg-dark text-white h-100" for="item-headphones" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-headphones fa-2x mb-2"></i>
                            <h5 class="card-title">Headphones</h5>
                        </div>
                    </label>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3">
                    <input type="radio" class="btn-check" name="item" id="item-laptop" value="Laptop" required>
                    <label class="card bg-dark text-white h-100" for="item-laptop" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-laptop fa-2x mb-2"></i>
                            <h5 class="card-title">Laptop</h5>
                        </div>
                    </label>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3">
                    <input type="radio" class="btn-check" name="item" id="item-monitor" value="Monitor" required>
                    <label class="card bg-dark text-white h-100" for="item-monitor" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-desktop fa-2x mb-2"></i>
                            <h5 class="card-title">Monitor</h5>
                        </div>
                    </label>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3">
                    <input type="radio" class="btn-check" name="item" id="item-mouse" value="Mouse" required>
                    <label class="card bg-dark text-white h-100" for="item-mouse" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-mouse fa-2x mb-2"></i>
                            <h5 class="card-title">Mouse</h5>
                        </div>
                    </label>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3">
                    <input type="radio" class="btn-check" name="item" id="item-printer" value="Printer" required>
                    <label class="card bg-dark text-white h-100" for="item-printer" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-print fa-2x mb-2"></i>
                            <h5 class="card-title">Printer</h5>
                        </div>
                    </label>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3">
                    <input type="radio" class="btn-check" name="item" id="item-speaker" value="Speaker" required>
                    <label class="card bg-dark text-white h-100" for="item-speaker" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-volume-up fa-2x mb-2"></i>
                            <h5 class="card-title">Speaker</h5>
                        </div>
                    </label>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3">
                    <input type="radio" class="btn-check" name="item" id="item-tablet" value="Tablet" required>
                    <label class="card bg-dark text-white h-100" for="item-tablet" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-tablet-alt fa-2x mb-2"></i>
                            <h5 class="card-title">Tablet</h5>
                        </div>
                    </label>
                </div>
            </div>


            <!--        DROP POINT CARDS-->
            <h4 class="text-center mb-3" style="color: #ffc107">Select Drop Point</h4>
            <div class="row justify-content-center mb-4">
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3" th:each="path : ${paths}">
                    <input type="radio" class="btn-check" name="path" id="drop-point-" th:id="'drop-point-' + ${path}" th:value="${path}" required>
                    <label class="card bg-dark text-white h-100" th:for="'drop-point-' + ${path}" style="cursor: pointer;">
                        <div class="card-body text-center">
                            <i class="fas fa-map-marker-alt fa-2x mb-2"></i>
                            <h5 class="card-title" th:text="${path}"></h5>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <button type="submit" class="btn btn-warning w-100">Send Request</button>
            </div>
        </form>
    </div>



    <!-- LAST 5 UNCOMPLETED ITEM REQUESTS -->
    <div class="container my-5">
        <button id="showRequestsBtn" class="btn btn-secondary mt-3">Show Last Requests</button>
        <div id="request-list">
            <!-- Hardcoded item requests for preview -->
            <ul class="list-group">
                <li th:each="itemRequest : ${last5ITemRequests}" class="list-group-item request-item">
                    <div class="d-flex justify-content-between">
                        <span th:text="${itemRequest.getItem()}" class="item-name">Item A</span>
                        <span th:text="${itemRequest.getStatus()}" class="badge bg-secondary">PENDING</span>
                    </div>
                    <small th:text="${itemRequest.getRequestTime()}" class="text-muted">2024-12-17 12:30</small>

                    <!-- Hidden Details -->
                    <div class="details mt-3">
                        <div class="details-item-request">
                            <p><strong>Request ID:</strong> <p th:text="${itemRequest.getId()}">1</p></p>
                            <p><strong>Employee:</strong> <p th:text="${itemRequest.getEmployee().getFirstName()}">John Doe</p></p>
                            <p><strong>Path:</strong> <p th:text="${itemRequest.getPath()}">Path A</p></p>
                        </div>
                        <div class="progress-bar" id="progress-bar">
                            <span class="fill-progress-bar" id="fill-progress-bar"></span>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>



    <!-- PREVIOUS ITEM REQUESTS -->
    <div class="card mb-4 bg-dark text-white">
        <div class="card-header bg-secondary">
            <i class="fas fa-table me-1"></i>
            Previous Item Requests
        </div>
        <div class="card-body">
            <table id="datatablesSimple" class="table table-dark table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Time Requested</th>
                    <th>Item</th>
                    <th>Path</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="itemRequest : ${itemRequests}">
                    <td th:text="${itemRequest.getId()}">REQUEST ID</td>
                    <td th:text="${itemRequest.getRequestTime()}">REQUEST TIME</td>
                    <td th:text="${itemRequest.getItem()}">ITEM</td>
                    <td th:text="${itemRequest.getPath()}">PATH</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
