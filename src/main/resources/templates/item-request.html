<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request an Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
</head>
<body class="bg-black text-white">

<!-- NAVBAR -->
<nav th:replace="fragments/fragments :: navbar"></nav>

<div class="container my-5">
    <h2 class="text-center mb-4">Request an Item</h2>
    <form method="post" id="request-form" class="mb-4" style="max-width: 500px; margin: auto;">
        <div class="mb-3">
            <label for="item-select" class="form-label">Select Item</label>
            <select id="item-select" name="item" class="form-select form-select-sm" required>
                <option value="" disabled selected>Select an item</option>
                <option th:each="item : ${items}" th:value="${item}" th:text="${item}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="drop-point-select" class="form-label">Select Drop Point</label>
            <select id="drop-point-select" name="path" class="form-select form-select-sm" required>
                <option value="" disabled selected>Select a drop point</option>
                <option th:each="path : ${paths}" th:value="${path}" th:text="${path}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-warning w-100">Send Request</button>
    </form>


    <hr>

    <div class="status-section">
        <h3 class="mb-3">Request Status</h3>
        <div class="status-list list-group" id="status-list">
            <div th:if="${itemRequests.size == 0}" class="list-group-item text-center">No requests yet.</div>
            <div th:each="itemRequest : ${itemRequests}">
                <strong>Requested: </strong> <span th:text="${itemRequest.getItem()} + ' to ' + ${itemRequest.getPath()}">Item to Path</span>
                <div class="badge bg-warning text-dark">Pending</div>
                <small th:text="${itemRequest.getRequestTime()}">Timestamp</small>
            </div>

        </div>
    </div>
</div>

<!-- FOOTER -->
<footer th:replace="fragments/fragments :: footer"></footer>
