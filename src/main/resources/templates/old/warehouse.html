<script>
    // Fetch completed deliveries asynchronously
    fetch('/warehouse/api/completed-deliveries')
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to fetch completed deliveries');
            }
            return response.json();
        })
        .then(data => {
            const tableBody = document.getElementById('completedDeliveriesTable');
            tableBody.innerHTML = ''; // Clear the loading message

            // Populate table rows dynamically
            data.forEach(delivery => {
                const row = document.createElement('tr');

                // Add cells for each column
                row.innerHTML = `
                    <td>${delivery.deliveryId}</td>
                    <td>${delivery.deliveryStarted}</td>
                    <td>${delivery.deliveryFinished}</td>
                    <td>${delivery.numberOfObstacles}</td>
                    <td>${delivery.path}</td>
                `;

                tableBody.appendChild(row);
            });

            // Re-initialize the Simple-DataTable after adding rows
            const datatablesSimple = document.getElementById('datatablesSimple');
            if (datatablesSimple) {
                new simpleDatatables.DataTable(datatablesSimple);
            }
        })
        .catch(error => {
            console.error('Error fetching completed deliveries:', error);
            const tableBody = document.getElementById('completedDeliveriesTable');
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-danger">Failed to load completed deliveries.</td>
                </tr>
            `;
        });
</script>
