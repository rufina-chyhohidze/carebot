<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <style>
        .control-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        .control-buttons button {
            width: 120px;
            height: 50px;
            font-size: 1.2rem;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-black text-white">

<!-- NAVBAR -->
<nav th:replace="fragments/fragments :: navbar"></nav>

<h2 class="text-center mb-4">Control Car</h2>

<div class="control-buttons">
    <button id="forwardsButton" class="btn btn-primary">Forwards</button>
    <button id="backwardsButton" class="btn btn-danger">Backwards</button>
    <button id="leftButton" class="btn btn-warning">Turn Left</button>
    <button id="rightButton" class="btn btn-success">Turn Right</button>
</div>

<script>
    function sendCommand(command) {
        const url = `http://192.168.129.0:8081/data/mode/${command}`;
        fetch(url, {
            method: "GET",
        })
            .then(response => {
                if (response.ok) {
                    return response.text();
                } else {
                    throw new Error("Something went wrong");
                }
            })
            .then(data => {
                console.log("Response received:", data);
            })
            .catch(error => {
                console.error("Error:", error);
            });
    }

    function setupButton(buttonId, command) {
        const button = document.getElementById(buttonId);

        // Send command when button is pressed
        button.addEventListener("mousedown", function () {
            sendCommand(command);
        });

        // Send "stop" when button is released
        button.addEventListener("mouseup", function () {
            sendCommand("stop");
        });

        // Touchscreen support
        button.addEventListener("touchstart", function () {
            sendCommand(command);
        });

        button.addEventListener("touchend", function () {
            sendCommand("stop");
        });
    }

    // Setup buttons
    setupButton("forwardsButton", "forwards");
    setupButton("backwardsButton", "backwards");
    setupButton("leftButton", "left");
    setupButton("rightButton", "right");
</script>
<br><br>
<!-- FOOTER -->
<footer th:replace="fragments/fragments :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
