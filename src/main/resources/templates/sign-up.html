<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../static/css/signup.css" th:href="@{/css/signup.css}">
</head>
<body>

<div class="overlay"></div>

<!-- NAVBAR -->
<!--<nav th:replace="fragments/fragments :: navbar"></nav>-->

<div class="container">
  <div class="form-section">
    <h2>Sign Up</h2>
    <form action="/sign-up" method="POST">
      <div class="row">
        <!-- LEFT COLUMN -->
        <div class="col-left">
          <div class="form-group mb-3">
            <label for="firstName" class="form-label text-white">First Name</label>
            <input class="form-control" id="firstName" name="firstName" placeholder="Enter first name" type="text" required/>
          </div>

          <div class="form-group mb-3">
            <label for="lastName" class="form-label text-white">Last Name</label>
            <input class="form-control" id="lastName" name="lastName" placeholder="Enter last name" type="text" required />
          </div>

          <div class="mb-3">
            <label for="gender" class="form-label text-white">Gender:</label>
            <select id="gender" class="form-select" name="gender" required>
              <option value="" disabled selected>Select Gender</option>
              <option th:each="g : ${T(be.kdg.programming3.domain.Gender).values()}"
                      th:value="${g}" th:text="${g.name()}">
              </option>
            </select>
            <div class="invalid-feedback">Please select a gender.</div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label text-white">Date of Birth</label>
            <input class="form-control" id="dob" name="dob" type="date" required />
          </div>

          <div class="form-group mb-3">
            <label for="phoneNumber" class="form-label text-white">Phone Number</label>
            <input class="form-control" id="phoneNumber" name="phoneNumber" placeholder="Enter phone number" type="text" required />
          </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="col-right">
          <div class="mb-3">
            <label for="employeeType" class="form-label text-white">Employee Role</label>
            <select id="employeeType" class="form-select" name="employeeType" required>
              <option value="" disabled selected>Select Employee Role</option>
              <option th:each="g : ${T(be.kdg.programming3.domain.EmployeeRole).values()}"
                      th:value="${g}" th:text="${g.name()}">
              </option>
            </select>
            <div class="invalid-feedback">Please select an employee role.</div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label text-white">Email</label>
            <input class="form-control" id="email" name="email" placeholder="Enter email address" type="email" required />
          </div>

          <div class="form-group mb-3">
            <label  for="password" class="form-label text-white">Password</label>
            <input class="form-control" id="password" name="password" placeholder="Enter password" type="password" required />
          </div>

          <div class="form-group mb-3">
            <label for="confirmPassword" class="form-label text-white">Confirm Password</label>
            <input class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" type="password" required />
          </div>
        </div>
      </div>

      <div class="form-button-container">
        <button type="submit" class="btn btn-primary btn-lg">Register</button>
        <a href="/" class="btn btn-secondary btn-lg">Back Home</a>
      </div>
    </form>
  </div>
</div>

<!--<div th:replace="fragments/fragments :: footer"></div>-->

<script>
  document.getElementById('signupForm').addEventListener('submit', function (e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      e.preventDefault();
      alert('Passwords do not match!');
    }
  });
</script>

</body>
</html>
